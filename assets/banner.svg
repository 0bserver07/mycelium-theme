<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6f946f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c28b61;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="mycelium-fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#476447;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#476447;stop-opacity:0.1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="200" fill="url(#bg)" rx="8"/>

  <!-- Mycelium network (left side) - organic bezier curves -->
  <!-- Main hyphae branches -->
  <path d="M 40 160 C 60 140, 80 120, 110 105" stroke="#476447" stroke-width="2" fill="none" opacity="0.7"/>
  <path d="M 110 105 C 130 95, 155 85, 180 80" stroke="#476447" stroke-width="1.8" fill="none" opacity="0.6"/>
  <path d="M 110 105 C 125 120, 145 140, 170 150" stroke="#476447" stroke-width="1.5" fill="none" opacity="0.5"/>
  <path d="M 110 105 C 100 85, 85 60, 75 45" stroke="#6f946f" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M 180 80 C 200 75, 225 68, 250 70" stroke="#6f946f" stroke-width="1.5" fill="none" opacity="0.5"/>
  <path d="M 180 80 C 195 95, 215 110, 240 115" stroke="#476447" stroke-width="1.3" fill="none" opacity="0.45"/>
  <path d="M 170 150 C 190 155, 215 158, 245 155" stroke="#476447" stroke-width="1.2" fill="none" opacity="0.4"/>
  <path d="M 75 45 C 90 35, 110 30, 135 35" stroke="#6f946f" stroke-width="1.2" fill="none" opacity="0.5"/>
  <path d="M 250 70 C 270 65, 290 60, 310 65" stroke="#476447" stroke-width="1" fill="none" opacity="0.3"/>
  <path d="M 240 115 C 260 120, 280 128, 305 125" stroke="#476447" stroke-width="1" fill="none" opacity="0.3"/>
  <path d="M 245 155 C 265 158, 285 155, 310 148" stroke="#476447" stroke-width="0.8" fill="none" opacity="0.25"/>

  <!-- Secondary fine hyphae -->
  <path d="M 60 170 C 70 155, 85 145, 110 105" stroke="#476447" stroke-width="1" fill="none" opacity="0.35"/>
  <path d="M 30 120 C 50 115, 75 110, 110 105" stroke="#6f946f" stroke-width="1" fill="none" opacity="0.3"/>
  <path d="M 135 35 C 155 40, 170 50, 180 80" stroke="#6f946f" stroke-width="1" fill="none" opacity="0.4"/>
  <path d="M 170 150 C 160 165, 155 175, 148 185" stroke="#476447" stroke-width="0.8" fill="none" opacity="0.3"/>
  <path d="M 250 70 C 255 50, 260 38, 268 25" stroke="#476447" stroke-width="0.8" fill="none" opacity="0.2"/>
  <path d="M 240 115 C 235 130, 230 145, 245 155" stroke="#476447" stroke-width="0.8" fill="none" opacity="0.25"/>

  <!-- Whisker-thin trailing hyphae -->
  <path d="M 310 65 C 325 60, 340 62, 355 68" stroke="#476447" stroke-width="0.6" fill="none" opacity="0.15"/>
  <path d="M 305 125 C 320 128, 340 125, 355 120" stroke="#476447" stroke-width="0.6" fill="none" opacity="0.15"/>
  <path d="M 310 148 C 325 145, 345 140, 360 135" stroke="#476447" stroke-width="0.5" fill="none" opacity="0.1"/>

  <!-- Junction nodes (where hyphae branch) -->
  <circle cx="110" cy="105" r="4" fill="#6f946f" opacity="0.8"/>
  <circle cx="180" cy="80" r="3.5" fill="#6f946f" opacity="0.7"/>
  <circle cx="170" cy="150" r="3" fill="#6f946f" opacity="0.6"/>
  <circle cx="75" cy="45" r="2.5" fill="#6f946f" opacity="0.5"/>
  <circle cx="250" cy="70" r="2.5" fill="#476447" opacity="0.5"/>
  <circle cx="240" cy="115" r="2" fill="#476447" opacity="0.4"/>
  <circle cx="245" cy="155" r="2" fill="#476447" opacity="0.35"/>
  <circle cx="135" cy="35" r="2" fill="#6f946f" opacity="0.45"/>

  <!-- Fruiting body accent nodes (terracotta) -->
  <circle cx="40" cy="160" r="5" fill="#c28b61" opacity="0.85"/>
  <circle cx="60" cy="170" r="3" fill="#c28b61" opacity="0.6"/>
  <circle cx="148" cy="185" r="3.5" fill="#c28b61" opacity="0.5"/>

  <!-- Spore-like fading dots -->
  <circle cx="310" cy="65" r="1.5" fill="#476447" opacity="0.2"/>
  <circle cx="305" cy="125" r="1.5" fill="#476447" opacity="0.2"/>
  <circle cx="355" cy="68" r="1" fill="#476447" opacity="0.1"/>
  <circle cx="355" cy="120" r="1" fill="#476447" opacity="0.1"/>
  <circle cx="30" cy="120" r="2" fill="#476447" opacity="0.25"/>
  <circle cx="268" cy="25" r="1.5" fill="#476447" opacity="0.15"/>

  <!-- Title -->
  <text x="420" y="85" font-family="Georgia, 'Times New Roman', serif" font-size="38" fill="#e6edf3" font-weight="bold" letter-spacing="1">mycelium</text>

  <!-- Accent line -->
  <rect x="420" y="93" width="80" height="2" fill="url(#accent)" rx="1"/>

  <!-- Subtitle -->
  <text x="420" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" fill="#8b949e">Write in Obsidian. Publish with Astro.</text>

  <!-- Stat badges -->
  <rect x="720" y="68" width="110" height="28" rx="14" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="775" y="87" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#6f946f" text-anchor="middle">7 themes</text>

  <rect x="720" y="104" width="110" height="28" rx="14" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="775" y="123" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#c28b61" text-anchor="middle">9 plugins</text>
</svg>
